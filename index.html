<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Predicción de Cultivo</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 30px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 450px;
      backdrop-filter: blur(10px);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 1.8em;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: none;
      outline: none;
      font-size: 1em;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #ff9800;
      color: #fff;
      font-size: 1.1em;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: #e68900;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      font-size: 1.1em;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Predicción de Cultivo 🌱</h1>
    <form id="plantForm">
      <label for="N">N (Nitrógeno)</label>
      <input type="number" id="N" name="N" required />

      <label for="P">P (Fósforo)</label>
      <input type="number" id="P" name="P" required />

      <label for="K">K (Potasio)</label>
      <input type="number" id="K" name="K" required />

      <label for="temperature">Temperatura (°C)</label>
      <input type="number" step="0.01" id="temperature" name="temperature" required />

      <label for="humidity">Humedad (%)</label>
      <input type="number" step="0.01" id="humidity" name="humidity" required />

      <label for="ph">pH</label>
      <input type="number" step="0.01" id="ph" name="ph" required />

      <label for="rainfall">Lluvia (mm)</label>
      <input type="number" step="0.01" id="rainfall" name="rainfall" required />

      <button type="submit">Predicción</button>
    </form>
    <div id="resultado"></div>
  </div>

  <script>
    document.getElementById("plantForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const data = {
        N: parseInt(document.getElementById("N").value),
        P: parseInt(document.getElementById("P").value),
        K: parseInt(document.getElementById("K").value),
        temperature: parseFloat(document.getElementById("temperature").value),
        humidity: parseFloat(document.getElementById("humidity").value),
        ph: parseFloat(document.getElementById("ph").value),
        rainfall: parseFloat(document.getElementById("rainfall").value),
      };

      try {
        const response = await fetch("http://localhost:8000/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });

        if (!response.ok) {
          throw new Error("Error en la respuesta del servidor");
        }

        const result = await response.json();
        document.getElementById("resultado").innerText =
          "🌾 Cultivo recomendado: " + result.prediction;
      } catch (error) {
        document.getElementById("resultado").innerText =
          "❌ Error al conectarse con el servidor: " + error;
      }
    });
  </script>
</body>
</html>
